name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12 and sync dependencies
        run: uv sync --extra dev --python 3.12

      - name: Run lint and static checks
        run: make lint

      - name: Run test suite and verification gate on synthetic/sample data
        run: make verify
