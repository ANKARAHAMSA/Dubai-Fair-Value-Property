[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "dubai-fair-value"
version = "0.1.0"
description = "Fair-value estimation, calibrated uncertainty intervals, SHAP explanations, market analytics, API, and dashboard for Dubai residential real estate."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Shahin Hamza" }]
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.2.0",
    "pyarrow>=16.0.0",
    "duckdb>=1.0.0",
    "pandera>=0.20.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "osmnx>=1.9.0",
    "geopy>=2.4.0",
    "rapidfuzz>=3.9.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "optuna>=3.6.0",
    "shap>=0.46.0",
    "mapie>=0.8.6",
    "statsmodels>=0.14.2",
    "scipy>=1.13.0",
    "streamlit>=1.38.0",
    "plotly>=5.23.0",
    "pydeck>=0.9.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "matplotlib>=3.9.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.110.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "nbconvert>=7.16.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "pandas-stubs>=2.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dfv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/dfv"]
omit = ["src/dfv/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["tests/", "notebooks/"]
